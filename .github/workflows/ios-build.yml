name: iOS Sideload Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "=== Available Xcode versions ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          latest=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            echo "Selecting: $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          else
            echo "Using default Xcode"
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Inspect project schemes and targets
        run: |
          xcodebuild -list -project iOSImageGenerator.xcodeproj

      - name: Build iOS App (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project iOSImageGenerator.xcodeproj \
            -scheme iOSImageGenerator \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_DIR=${{ github.workspace }}/build 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/iOSImageGenerator.app Payload/
          zip -qry -9 "iOSImageGenerator.ipa" Payload/
          echo "IPA Size: $(du -h iOSImageGenerator.ipa | cut -f1)"

      - name: Package App Bundle (.zip)
        run: |
          cd build/Release-iphoneos
          zip -qry -9 "${{ github.workspace }}/iOSImageGenerator.app.zip" iOSImageGenerator.app
          cd ${{ github.workspace }}

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSImageGenerator-IPA
          path: iOSImageGenerator.ipa

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSImageGenerator-App-Bundle
          path: iOSImageGenerator.app.zip

      - name: Create GitHub Release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.0.{0}', github.run_number) }}
          name: ${{ format('Release v2.0.{0} - iOSImageGenerator (iPhone XS ➔ 17 Pro Max)', github.run_number) }}
          body: |
            ## 🎨 iOSImageGenerator v2.0
            
            **Tác giả / Author: VanKhoa** ([@emlavankhoahienma-hue](https://github.com/emlavankhoahienma-hue))  
            *Based on concept by Adi Mizrahi*
            
            ### 🌟 Tính năng mới / What's New:
            - 📱 **Hỗ trợ từ iPhone XS ➔ 17 Pro Max** (iOS 17.0+).
            - 🧠 **Mô hình AI đỉnh cao từ Hugging Face**: FLUX.1 Schnell, FLUX.1 Realism, FLUX Anime, SDXL Turbo.
            - 🍎 **Apple Intelligence**: Khả dụng trên iPhone 15 Pro, 16, 17 chạy iOS 18.4+.
            - 🌐 **Hỗ trợ Song ngữ Anh - Việt (Bilingual: Tiếng Việt 🇻🇳 & English 🇬🇧)**.
            - 📐 **Tùy chọn tỉ lệ khung hình**: 1:1 Vuông, 9:16 Dọc (Hình nền iPhone), 16:9 Ngang.
            
            ### 📦 Downloads:
            - **`iOSImageGenerator.ipa`**: Unsigned IPA ready to sideload via **Sideloadly**, **TrollStore**, **AltStore**, **Scarlet**, or **Feather**.
            - **`iOSImageGenerator.app.zip`**: Zipped `.app` bundle for simulator or custom resign toolchains.
          files: |
            iOSImageGenerator.ipa
            iOSImageGenerator.app.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
