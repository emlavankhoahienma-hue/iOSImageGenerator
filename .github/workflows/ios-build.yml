name: iOS Sideload Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "=== Available Xcode versions ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          latest=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            echo "Selecting: $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          else
            echo "Using default Xcode"
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Inspect project schemes and targets
        run: |
          xcodebuild -list -project iOSImageGenerator.xcodeproj

      - name: Build iOS App (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project iOSImageGenerator.xcodeproj \
            -scheme iOSImageGenerator \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_DIR=${{ github.workspace }}/build 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/iOSImageGenerator.app Payload/
          zip -qry -9 "StealHex_VN.ipa" Payload/
          cp "StealHex_VN.ipa" "iOSImageGenerator.ipa"
          echo "IPA Size: $(du -h StealHex_VN.ipa | cut -f1)"

      - name: Package App Bundle (.zip)
        run: |
          cd build/Release-iphoneos
          zip -qry -9 "${{ github.workspace }}/StealHex_VN.app.zip" iOSImageGenerator.app
          cd ${{ github.workspace }}

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealHex_VN-IPA
          path: StealHex_VN.ipa

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealHex_VN-App-Bundle
          path: StealHex_VN.app.zip

      - name: Create GitHub Release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v3.0.{0}', github.run_number) }}
          name: ${{ format('Release v3.0.{0} - StealHex VN', github.run_number) }}
          body: |
            ## StealHex VN v3.0
            
            **Tac gia / Author: VanKhoa** ([@emlavankhoahienma-hue](https://github.com/emlavankhoahienma-hue))  
            *Dua tren y tuong nguyen ban cua Adi Mizrahi*
            
            ### Tinh nang moi / What's New:
            - **Doi ten ung dung / App Name**: StealHex VN.
            - **Thiet ke toi gian / Minimalist UI**: Loai bo toan bo emoji, phong cach Apple hien dai va tinh te.
            - **Thuat toan tu dong dinh tuyen mo hinh / Intelligent Prompt Auto-Router**: Tu dong phan tich noi dung cau lenh (Prompt) va lua chon mo hinh toi uu nhat (FLUX.1 Schnell, FLUX Realism, FLUX Anime, FLUX 3D Render, SDXL Turbo).
            - **Hieu ung AI tra ve / Smooth AI Return Transition**: Hieu ung chuyen canh mem mai va phan hoi tung giai doan xu ly.
            - **An ban phim thong minh / Tap to Dismiss Keyboard**: Cham vao bat ky vi tri nao ngoai man hinh de an ban phim ngay lap tuc.
            - **Ho tro song ngu / Bilingual**: Tieng Viet (VI) & English (EN).
            
            ### Downloads:
            - **`StealHex_VN.ipa`**: File IPA unsigned cai dat truc tiep qua Sideloadly, TrollStore, AltStore, Scarlet, Feather.
            - **`StealHex_VN.app.zip`**: File `.app` bundle nguyen ban.
          files: |
            StealHex_VN.ipa
            iOSImageGenerator.ipa
            StealHex_VN.app.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
