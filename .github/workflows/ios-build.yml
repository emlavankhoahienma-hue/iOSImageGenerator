name: iOS Sideload Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "=== Available Xcode versions ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          latest=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then
            echo "Selecting: $latest"
            sudo xcode-select -s "$latest/Contents/Developer"
          else
            echo "Using default Xcode"
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Inspect project schemes and targets
        run: |
          xcodebuild -list -project iOSImageGenerator.xcodeproj

      - name: Build iOS App (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project iOSImageGenerator.xcodeproj \
            -scheme iOSImageGenerator \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_DIR=${{ github.workspace }}/build 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build.log

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/iOSImageGenerator.app Payload/
          zip -qry -9 "StealHex_VN.ipa" Payload/
          cp "StealHex_VN.ipa" "iOSImageGenerator.ipa"
          echo "IPA Size: $(du -h StealHex_VN.ipa | cut -f1)"

      - name: Package App Bundle (.zip)
        run: |
          cd build/Release-iphoneos
          zip -qry -9 "${{ github.workspace }}/StealHex_VN.app.zip" iOSImageGenerator.app
          cd ${{ github.workspace }}

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealHex_VN-IPA
          path: StealHex_VN.ipa

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StealHex_VN-App-Bundle
          path: StealHex_VN.app.zip

      - name: Create GitHub Release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v3.0.{0}', github.run_number) }}
          name: ${{ format('Release v3.0.{0} - StealHex VN', github.run_number) }}
          body: |
            ## StealHex VN v3.1
            
            **Tac gia / Author: VanKhoa** ([@emlavankhoahienma-hue](https://github.com/emlavankhoahienma-hue))  
            *Dua tren y tuong nguyen ban cua Adi Mizrahi*
            
            ### Tinh nang vuot troi / Breakthrough Features:
            - **Bo nang cap ngu nghia PromptEngine (On-Device Semantic Translator & Enhancer)**: Tu dong dich thuat va lam giau cac tu khoa tieng Viet va y tuong sang prompt tieng Anh chuan dien anh (optical lighting, 85mm lens, 8k resolution, photorealistic) de mo hinh AI hieu dung va ve cuc dep, khong bi lo mo hay sai chu de.
            - **Ho tro ket noi May chu ca nhan / Local PC Server (ComfyUI / Automatic1111 / Forge / ngrok)**: Cho phep nguoi dung chay truc tiep mo hinh FLUX.1 Dev, SD 3.5 hoac bat ky model khung nao tren may tinh ca nhan, truyen anh net ve dien thoai (ho tro thoi gian ket xuat tu 30s - 3 phut).
            - **Bo loc chat luong cao & Negative Prompts**: Tu dong loai bo anh mo, bien dang, hien tuong quang hoc sai lech.
            - **Ho tro toan dien tu iPhone XS den 18 Pro Max (iOS 17.0+)**: Chay muot tren moi doi may.
            - **Thiet ke toi gian, khong emoji, an ban phim 1 cham**.
            
            ### Downloads:
            - **`StealHex_VN.ipa`**: File IPA unsigned cai dat truc tiep qua Sideloadly, TrollStore, AltStore, Scarlet, Feather.
            - **`StealHex_VN.app.zip`**: File `.app` bundle nguyen ban.
          files: |
            StealHex_VN.ipa
            iOSImageGenerator.ipa
            StealHex_VN.app.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
